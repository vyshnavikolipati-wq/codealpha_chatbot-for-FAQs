<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CodeAlpha FAQ Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-container">
    <div class="header">
      <h2>CodeAlpha FAQ Bot 🤖</h2>
      <p>Ask me about CodeAlpha Internship</p>
    </div>
    <div class="chat-box" id="chatBox">
      <div class="bot-msg">Hi! I'm your CodeAlpha helper. Ask me any question about the internship!</div>
    </div>
    <div class="input-area">
      <input type="text" id="userInput" placeholder="Type your question here..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
